    - "Electronics/raspberry_pi_bracket.stl"
    - "Electronics/wago_mount.stl"
    - "Frame/[a]_rubber_foot_block_x4.stl"
    - "MK3_LCD/lcd_supports_mk3.stl"
    - "MK3_LCD/lcd_cable_clip_x4.stl"
    - "MK3_LCD/lcd_cover_mk3_single_color.stl"
    - "MK3_LCD/mmu_lcd_cover_mk3.3mf"
    - "Panels/deck_panel_front.stl"
    - "Panels/deck_panel_rear_connector.stl"
    - "Panels/deck_panel_rear_left.stl"
    - "Spool_Management/filament_guide_ecas.stl"
    - "Spool_Management/spool_holder.stl"
    - "X_Gantry/[a]_belt_clip_x2.stl"
    - "X_Gantry/carriage_block.stl"
    - "X_Gantry/gantry_frame_bumper.stl"
    - "X_Gantry/superpinda_bracket.stl"
    - "Y_Axis/[a]_belt_clip_x2.stl"
    - "Y_Axis/heatbed_cable_cover_bottom_2mm_nylon.stl"
    - "Y_Axis/heatbed_cable_cover_bottom_3mm_nylon.stl"
    - "Y_Axis/y_idler_bracket.stl"
    - "XZ_Axis/[a]_motor_mounts_b.stl"
    - "XZ_Axis/idler_blocks_b.stl"
    - "X_Gantry/[a]_xz_end_clips.stl"
    - "X_Gantry/belt_clip_x2.stl"
    - "Y_Axis/heatbed_cable_cover_top.stl"
    - "Frame/[a]_front_grill_logo_plates.stl"
    - "Frame/front_grill_left.stl"
    - "Frame/front_grill_right.stl"
