# Edit this file to define how the model is presented and configured.
# The sibling .scaffold.json lists every group, part, and node path you can
# target with the autoAssign rules and nodes block below.

model:
  name: Prusawire 2026.R1
  glb: Prusawire_2026.R1.glb

palette:
  Main:               { color: "#797979" }                                            # primary printed parts
  Accent:             { color: "#9F6204" }                                            # user-pickable contrast
  Frame:              { color: "#3a3a3a", metalness: 0.7, showInPicker: false }       # Misumi extrusions, linear rails
  Hardware:           { color: "#888888", metalness: 0.9, showInPicker: false }       # NEMA cans, ballscrews, visible motors
  Bed:                { color: "#cc8800", showInPicker: false }                       # heated bed
  Electronics:        { color: "#1d3b2a", metalness: 0.5, showInPicker: false }       # PCB substrates, mainboards
  Glass:              { color: "#ccddee", metalness: 0.1, opacity: 0.15, showInPicker: false }
  PEI Sheet:          { color: "#F0B27A", showInPicker: false }                       # textured build surface
  White:              { color: "#F5F5F5", showInPicker: false }                       # sheet steel, labels
  Hidden:             { showInPicker: false, showInTree: false }    # rendered but absent from the tree

# Patterns are fnmatch globs against a node's leaf name or full path.
# Order matters — first match wins.
autoAssign:
  # ---- Fasteners (M-prefix sizes catch nearly all; a couple of catch-alls
  #      pick up DIN-named screws and Grub_screw* parts) ----------------
  - { match: "M2*",                category: Hardware }
  - { match: "M3*",                category: Hardware }
  - { match: "M4*",                category: Hardware }
  - { match: "M5*",                category: Hardware }
  - { match: "*Screw*",            category: Hardware }   # DIN-named screws
  - { match: "*screw*",            category: Hardware }   # Grub_screw*

  # ---- Bearings, bushings, linear motion internals --------------------
  #- { match: "Bearing_*",          category: Hidden }
  - { match: "F623_Bearing*",      category: Hardware }   # flanged idler bearings
  #- { match: "LM*",                category: Hidden }   # LM linear bearings + LM_Bearings group

  # ---- STEP-import noise (compound bodies, logos, library parts) ------
  - { match: "COMPOU*",            category: Hidden }
  - { match: "SOLID*",             category: Hidden }
  - { match: "Cylinder*",          category: Hidden }
  - { match: "LOGO*",              category: Hidden }
  - { match: "User_Library-*",     category: Hidden }
  - { match: "Extruded_*",         category: Hidden }   # PCB extruded substrate geometry

  # ---- Electronics: SMD package families ------------------------------
  - { match: "CAPC*",              category: Hidden }
  - { match: "RESC*",              category: Hidden }
  - { match: "QFN*",               category: Hidden }
  - { match: "SOT*",               category: Hidden }
  - { match: "SOD*",               category: Hidden }
  - { match: "DO*",                category: Hidden }
  - { match: "INDC*",              category: Hidden }
  - { match: "LED*",               category: Hidden }
  - { match: "HDR*",               category: Hidden }
  - { match: "TSW*",               category: Hidden }
  - { match: "SRN*",               category: Hidden }
  - { match: "MR*",                category: Hidden }
  - { match: "XH*",                category: Hidden }
  - { match: "SD*",                category: Hidden }
  - { match: "ADXL*",              category: Hidden }
  - { match: "GT*",                category: Hidden }
  - { match: "CM*",                category: Hidden }
  - { match: "EASUN*",             category: Hidden }
  #- { match: "ZF_Electronics_*",   category: Hidden }
  - { match: "KF*",                category: Hidden }
  - { match: "SL*",                category: Hidden }

  # ---- Connectors, wiring, generic motor/encoder internals ------------
  #- { match: "Crimped_*",          category: Hidden }
  - { match: "Camera_Connector*",  category: Hidden }
  - { match: "Display_Connector*", category: Hidden }
  #- { match: "Microphone_*",       category: Hidden }
  - { match: "*PIN_HEADER*",       category: Hidden }
  - { match: "*USB*PORTS*",        category: Hidden }
  - { match: "PTFE_*",             category: Hidden }
  #- { match: "VHB*",               category: Hidden }
  #- { match: "Rubber_*",           category: Hidden }
  #- { match: "Switch_*",           category: Hidden }
  - { match: "Needle_*",           category: Hidden }

  # ---- NEMA motor cans (cosmetic, fine to hide; you can flip these
  #      to Hardware later if you want them visible) --------------------
  #- { match: "NEMA*",              category: Hidden }
  - { match: "LDO*",               category: Hardware }   # LDO stepper motors

  # ---- Structural frame parts -----------------------------------------
  #- { match: "MGN*_Rail*",         category: Frame }
  #- { match: "MGN*_Carriage*",     category: Frame }
  #- { match: "Linear_Rod*",        category: Frame }
  #- { match: "Misumi_*",           category: Frame }

  # ---- Printed accent parts (a_ prefix naming convention) -------------
  - { match: "a_belt_clip_*",               category: Accent }
  - { match: "a_front_grill_logo_plates_*", category: Accent }
  - { match: "a_heat_set_practice_*",       category: Accent }
  - { match: "a_lcd_knob_*",                category: Accent }
  - { match: "a_motor_mounts_*",            category: Accent }
  - { match: "a_rubber_foot_block_*",       category: Accent }
  - { match: "a_x_block_*",                 category: Accent }
  - { match: "a_x_end_clip_*",              category: Accent }
  - { match: "a_z_block_*",                 category: Accent }
  - { match: "a_z_end_clip_*",              category: Accent }

  # ---- Catch-all for other printed/visible parts ----------------------
  # No convention emerged yet for non-accent printed parts. Add positive
  # rules here (e.g. "{ match: 'pp-*', category: Main }") as patterns stabilize.

# User-facing configuration choices consumed by the configurator manifest.
# Each choice gates nodes below via visible: { when: { <option>: <choice> } };
# the defaults define which variants render in CADScope's default view.
options:
  frame_type:
    label: "Donor Frame"
    choices:
      - { id: mk4, label: "MK4", default: true }
      - { id: mk3, label: "MK3" }
  pulley_size:
    label: "Pulley Size"
    choices:
      - { id: 16t, label: "16T (Prusa-spec)", default: true }
      - { id: 20t, label: "20T (Voron Switchwire-spec)" }
  z_rod:
    label: "Z Linear Rods"
    type: dropdown
    choices:
      - { id: 10x325, label: "10mm x 325mm (MK4 Z Rod)", default: true }
      - { id: 8x320,  label: "8mm x 320mm (MK3 Z Rod)" }
      - { id: 8x325,  label: "8mm x 325mm" }
      - { id: 8x330,  label: "8mm x 330mm" }
      - { id: 10x320, label: "10mm x 320mm" }
      - { id: 10x330, label: "10mm x 330mm" }
      - { id: 10x341, label: "10mm x 341mm" }
  z_rod_bearing:
    label: "Z Rod Bearing Type"
    choices:
      - { id: lm10luu, label: "LM10LUU", default: true, when: { z_rod: [10x320, 10x325, 10x330, 10x341] } }
      - { id: lm8uu,   label: "LM8UU",  when: { z_rod: [8x320, 8x325, 8x330] } }
      - { id: lm8luu,  label: "LM8LUU", when: { z_rod: [8x320, 8x325, 8x330] } }
  nut_type:
    label: "Square Nuts"
    choices:
      - { id: m3s, label: "M3S (Prusa-style M3 Square Nuts)", default: true }
      - { id: v0s, label: "V0S (Voron V0 1515 Style Square Nuts)" }
  y_attachment:
    label: "Y-Carriage Attachment"
    choices:
      - { id: bearing_clips, label: "Bearing Clips (MK4 Style)", default: true }
      - { id: u_bolts,       label: "U-Bolts (MK3 Style)" }
  mainboard:
    label: "Mainboard"
    choices:
      - { id: rambo, label: "Einsy Rambo", default: true }
      - { id: skr,   label: "SKR Mini E3" }
  toolhead_board:
    label: "Toolhead Board"
    choices:
      - { id: nitehawk,   label: "LDO Nitehawk-SB", default: true }
      - { id: btt_sb2209, label: "BTT SB2209 (USB)" }
  psu:
    label: "Power Supply"
    choices:
      - { id: delta_black, label: "Prusa Black (Delta)", default: true }
      - { id: mk3_silver,  label: "MK3 Silver" }
  toolhead:
    label: "Toolhead"
    choices:
      - { id: stealthburner, label: "Stealthburner (Revo)", default: true }
      - { id: afterburner,   label: "Afterburner (With Owl)" }
      - { id: anthead,       label: "AntHead (Experimental)" }
      - { id: jabberwocky,   label: "Jabberwocky (Experimental)" }
  lcd_knob:
    label: "LCD Knob Style"
    choices:
      - { id: switchwire, label: "Voron Switchwire", default: true }
      - { id: tri_wing,   label: "Prusa MK3 Tri-Wing" }
  badge_type:
    label: "Supplemental Badge"
    choices:
      - { id: combined, label: "Combined (single color)", default: true }
      - { id: separate, label: "Separate Back + Text (multi-color)" }

# Cross-option warnings rendered in the sidebar while their `when` matches.
compatibility:
  - when: { toolhead: anthead }
    message: "AntHead is an experimental toolhead mount and is not shown in the 3D preview. Its README (included in the download) covers sourcing the rest of AntHead and where to send feedback."
  - when: { toolhead: jabberwocky }
    message: "Jabberwocky is an experimental toolhead mount and is not shown in the 3D preview."

# ZIP download contents: base URL + always-included files + option-
# gated groups. Unassigned STLs are listed at the bottom for sorting.
