  #      variants overlap it and are hidden until made configurable ------
  Miley-Z-Axis-Assembly_v17/Z-Mounting-Plate-Assembly_v128/Standard-Spindle-Mounts/65mm-Half-Plate-Spindle-Mount:
    hidden: true
  Miley-Z-Axis-Assembly_v17/Z-Mounting-Plate-Assembly_v128/Standard-Spindle-Mounts/65mm-HOI-Spindle-Mount:
