# Edit this file to define how the model is presented and configured.
# The sibling .scaffold.json lists every group, part, and node path you can
# target with the autoAssign rules and nodes block below.

model:
  name: Milo V2 RC3
  glb: Milo_V2.RC3.glb

palette:
  Main:        { color: "#6a6a6a" }                                      # printed parts
  Accent:      { color: "#B02A2A" }                                      # Millennium red, user-pickable
  Frame:       { color: "#3a3a3a", metalness: 0.7, showInPicker: false } # extrusions, plates, rails
  Hardware:    { color: "#888888", metalness: 0.9, showInPicker: false } # fasteners, motors, ballscrews
  Electronics: { color: "#1d3b2a", metalness: 0.5, showInPicker: false } # switches, sensors
  Aluminum:    { color: "#c8c8cc", metalness: 0.85, showInPicker: false } # bare machined 6061
  Hidden:      { showInPicker: false, showInTree: false }                # rendered but absent from the tree

# Patterns are fnmatch globs against a node's leaf name (matching what the
# viewer tests; full paths are NOT matched). Order matters — first match wins.
# COMPOUND*/SOLID*/Body_*/Component* wrappers are deliberately NOT hidden:
# in this model every one of them is real geometry of a categorized part and
# inherits its ancestor's category.
autoAssign:
  # ---- Printed parts that must beat broader hardware globs below ------
  - { match: "Ballnut-plate*",          category: Main }      # printed plate; SFK* below is hardware
  - { match: "*ThrED*",                 category: Main }      # printed AB-block assemblies (bearings inside self-match Hardware)

  # ---- Accent parts (the repo's [a]-prefixed STLs); must beat the
  #      broader globs below -------------------------------------------
  - { match: "Y-Bearing-Block*",        category: Accent }    # block, insert, and (hidden) Voron variant
  - { match: "Way-Cover-Y-Front-*",     category: Accent }
  - { match: "Way-Cover-Magnet-Lock*",  category: Accent }
  - { match: "Interna*Faceplate*",      category: Accent }    # floating-bearing faceplates A/B + Voron variants
  - { match: "X-Bearing-Block-Insert*", category: Accent }
  - { match: "Z-Axis_Bearing-Block*",   category: Accent }    # underscore quirk in GLB; Z-Bearing-Block-Insert stays Main
  - { match: "Bellow-Attachment-Plate*", category: Accent }
  - { match: "Y-Axis-Bellow-*",         category: Accent }    # column/plate mag mounts
  - { match: "*bellow-mount*",          category: Accent }    # Y-Axis-Magnetic-bellow-mount assembly
  - { match: "65mm-Spindle-Mount-Front*", category: Accent }
  - { match: "80mm-Spindle-Mount-Front*", category: Accent }  # front half of the default printed mount
  - { match: "*Spindle-Mount-Front-printed*", category: Accent } # HOI printed fronts (Machined halves stay Frame)

  # ---- Non-geometry and placeholder parts ------------------------------
  - { match: "VHB-Tape*",               category: Hidden }
  - { match: "Bellow-Stand-In*",        category: Hidden }    # placeholder geometry

  # ---- Organizational groups that cascade a category ------------------
  - { match: "Plate-Fasteners*",        category: Hardware }
  - { match: "Fasteners*",              category: Hardware }
  - { match: "Hardware*",               category: Hardware }
  - { match: "Rail_carriages*",         category: Frame }
  - { match: "Plates*",                 category: Frame }
  - { match: "Extrusions*",             category: Frame }
  - { match: "*-rails*",                category: Frame }    # X-axis-rails / Y-Axis-rails / Z-Axis-rails groups

  # ---- Fasteners and small hardware -----------------------------------
  - { match: "ISO*",                    category: Hardware }  # ISO-numbered screws/nuts/washers
  - { match: "M[0-9]*",                 category: Hardware }  # M2x10 self-tappers, M3x20 SHCS, ...
  - { match: "DIN*",                    category: Hardware }  # grease nipples etc.
  - { match: "Din*",                    category: Hardware }
  - { match: "CNC-kitchen*",            category: Hardware }  # heat-set inserts
  - { match: "*Voron-Inserts*",         category: Hardware }  # heat-set insert bodies in printed parts
  - { match: "Heated_Inserts*",         category: Hardware }
  - { match: "Permanent_fasteners*",    category: Hardware }
  - { match: "5x20_sex-bolt*",          category: Hardware }
  - { match: "Sexbolt*",                category: Hardware }  # toolheight setter

  # ---- Bearings and motion hardware -----------------------------------
  - { match: "608ZZ*",                  category: Hardware }
  - { match: "5x7x8_Sleeve_Bearing*",   category: Hardware }
  - { match: "F8-*",                    category: Hardware }  # thrust bearings
  - { match: "SFK-0802-?00mm-Ballscrew*", category: Aluminum } # 300/600mm ballscrews, bright machined finish
  - { match: "SFK*",                    category: Hardware }  # ballnuts, AB-block hardware
  - { match: "TR8x8*",                  category: Hardware }  # leadscrew nuts
  - { match: "Double-Split-Shaft-Collar*", category: Hardware }
  - { match: "Coupler*",                category: Hardware }
  - { match: "Coluper*",                category: Hardware }
  - { match: "*Spider-Coupler*",        category: Hardware }
  - { match: "Nema*",                   category: Hardware }  # stepper motors
  - { match: "*Neodinium-Magnet*",      category: Hardware }
  - { match: "10x11-Cable*",            category: Hardware }  # cable chain links

  # ---- Electronics ------------------------------------------------------
  - { match: "D2F*",                    category: Electronics } # Omron microswitches
  - { match: "AY_v1*",                  category: Electronics } # inductive probe assemblies

  # ---- Frame: extrusions, rails, machined plates ----------------------
  - { match: "MGN*",                    category: Aluminum }  # linear rails + carriages, all axes
  - { match: "Internal-Axis-Bearing-Block*", category: Aluminum } # machined block groups (printed floating block inside stays Main)
  - { match: "*V-slot*",                category: Frame }
  - { match: "*V-Slot*",                category: Frame }
  - { match: "Openbuilds*",             category: Frame }
  - { match: "C-Beam*",                 category: Frame }
  - { match: "C_Beam*",                 category: Frame }
  - { match: "C_beam*",                 category: Frame }
  - { match: "Angle-Corner-Connector*", category: Frame }
  - { match: "Black_Angle_Corner*",     category: Frame }
  - { match: "*-Machined*",             category: Frame }     # machined halves of HOI spindle mounts
  - { match: "FMJ-V003",                category: Frame }     # black powdercoated steel
  - { match: "FMJ-V2",                  category: Frame }     # black powdercoated steel (FMJ* below is the printed variant)
  - { match: "*Tram-Plate*",            category: Frame }
  - { match: "*Joiner-Plate*",          category: Aluminum }  # X-to-Y joiner plate
  - { match: "X-Axis-Motor-Plate*",     category: Frame }
  - { match: "Miley-XY-Plate*",         category: Frame }     # group cascade; printed children self-match above

  # ---- Printed parts ----------------------------------------------------
  - { match: "*Way-Cover*",             category: Main }
  - { match: "Carriage-Hole-Plug*",     category: Main }
  - { match: "*Bearing-Block*",         category: Main }      # printed axis blocks
  - { match: "?-Axis-Motor-Mount*",     category: Main }     # X/Y/Z printed motor mounts
  - { match: "*Rear-Cable-Run*",        category: Main }
  - { match: "Rear-*",                  category: Main }      # chain anchors
  - { match: "Inductive-Probe-Mount*",  category: Main }
  - { match: "Micro-Switch-Mount*",     category: Main }
  - { match: "FMJ*",                    category: Main }      # FMJ spindle mount system
  - { match: "Fixated-V2*",             category: Aluminum }  # machined 6061 fixture plate (+ Full-Monty-Short variant)
  - { match: "Fixated*",                category: Main }      # printed accessories: centering tool, slot covers
  - { match: "Printed-Hold-Downs*",     category: Main }
  - { match: "Dust-cover*",             category: Main }
  - { match: "Housing*",                category: Main }
  - { match: "Tram-Aid*",               category: Main }
  - { match: "Table-Support*",          category: Main }      # printed table supports (per STL list)
  - { match: "Column-Ballast*",         category: Main }      # printed ballast shells (per STL list)
  - { match: "Logo_insert*",            category: Main }      # no [a] prefix in the STL repo
  - { match: "*Spindle-Mount*",         category: Main }      # printed mount halves (machined ones matched above)

# Per-node overrides — displayName, category, hidden, visible (when/unless),
# stl (download paths), visualOnly. Paths come from .scaffold.json's _nodes.
nodes:
